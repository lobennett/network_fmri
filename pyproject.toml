[project]
name = "network_fmri"
version = "0.1.0"
description = "Flywheel -> BIDS curation and pipeline submission for the r01network study"
readme = "README.md"
# Bounded: network_glm's pinned stack has no 3.14 wheels.
requires-python = ">=3.13,<3.14"
dependencies = [
    "datalad>=1.1",
    # provisions git-annex; pip cannot ship the binary
    "datalad-installer>=1.1",
    "fw-heudiconv",
    "global-signal-plots[plot]",
    # Owns the behavioural half: events.tsv, truncation QC, behaviour-driven trimming.
    "network-events",
    # Owns the GLMs; this repo owns their submission.
    "network-glm",
    # Exclusion decisions; this repo owns when they run.
    "network-qa",
]

[project.scripts]
network_fmri = "network_fmri.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Byte-faithful upstream mechababs sources at a pinned commit. The published patch
# applies against their exact context lines, so they must not be reformatted or fixed.
extend-exclude = ["tests/fixtures/campaign/mechababs-base"]

[tool.uv]
# Pillow 12 ships no wheel for this host (glibc 2.17) and its sdist needs libjpeg
# headers we do not have. matplotlib pulls it in for the PDF traces.
constraint-dependencies = ["pillow<12"]
# Only ever runs on Sherlock; without this uv solves splits we cannot hit.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
    # flywheel-sdk caps packaging<26, nilearn floors it at >=26; verified both work at 26.
    "packaging>=26",
]

[tool.uv.sources]
fw-heudiconv = { git = "https://github.com/lobennett/fw-heudiconv.git", rev = "81c44e778e785cf33c700e1a0fd7e14b2716a500" }
global_signal_plots = { git = "https://github.com/lobennett/global_signal_plots.git", rev = "ee5ad00ad2f51586d0379d2fe5a6a5fa3e2e60d7" }
network_events = { git = "https://github.com/lobennett/network_events.git", rev = "e3ceda53a8409ca103574d879390d38180ca9443" }
network_glm = { git = "https://github.com/lobennett/network_glm.git", rev = "c99a2810133b1b54cc9e62c37e5c277c99e25889" }
network_qa = { git = "https://github.com/lobennett/network_qa.git", rev = "9a2f22ca7325890a815ff6d3f7ac56c522e1abfc" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_fmri"]
