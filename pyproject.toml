[project]
name = "network_fmri"
version = "0.1.0"
description = "Flywheel -> BIDS curation and pipeline submission for the r01network study"
readme = "README.md"
# Bounded to the Python version supported by the pinned study packages.
requires-python = ">=3.13,<3.14"
dependencies = [
    "datalad>=1.1",
    # provisions git-annex; pip cannot ship the binary
    "datalad-installer>=1.1",
    "global-signal-plots[plot]",
    "network-fw2bids",
    "nibabel>=5.3",
    # Owns the behavioural half: events.tsv and truncation QC.
    "network-events",
    # Owns scan-decision evidence and approval validation.
    "network-qa",
]

[project.scripts]
network-fmri = "network_fmri.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# Pillow 12 ships no wheel for this host (glibc 2.17) and its sdist needs libjpeg
# headers we do not have. matplotlib pulls it in for the PDF traces.
constraint-dependencies = [
    "pillow<12",
]
# Only ever runs on Sherlock; without this uv solves splits we cannot hit.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
override-dependencies = [
    # flywheel-sdk caps packaging<26, nilearn floors it at >=26; verified both work at 26.
    "packaging>=26",
]

[tool.uv.sources]
global_signal_plots = { git = "https://github.com/lobennett/global_signal_plots.git", rev = "ee5ad00ad2f51586d0379d2fe5a6a5fa3e2e60d7" }
network_fw2bids = { git = "https://github.com/lobennett/network_fw2bids.git", rev = "e242cd9f9c4b38a3c1bcd4b22bf566ba31cb08de" }
network_events = { git = "https://github.com/lobennett/network_events.git", rev = "f858ec456f6c501de5f3eb50ab7fafa0aa52a5f8" }
network_qa = { git = "https://github.com/lobennett/network_qa.git", rev = "3ed9460a1cdb2fbb70c00368b62f6b49a4f1d99c" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_fmri"]
