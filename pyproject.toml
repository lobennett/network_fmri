[project]
name = "network_fmri"
version = "0.1.0"
description = "Submit fw-heudiconv Flywheel -> BIDS curation as Slurm jobs."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datalad>=1.1",
    # provisions git-annex; pip cannot ship the binary
    "datalad-installer>=1.1",
    "fw-heudiconv",
    "global-signal-plots[plot]",
    # Owns the behavioural half: events.tsv, truncation QC, behaviour-driven trimming.
    # A dependency rather than a sibling venv so `uv sync` provisions the whole chain and
    # the pipeline calls its console script by name like any other stage.
    "network-events",
]

[project.scripts]
network_fmri = "network_fmri.cli:main"

[tool.uv]
# Pillow 12 ships no wheel for this host (glibc 2.17) and its sdist needs libjpeg
# headers we do not have. matplotlib pulls it in for the PDF traces.
constraint-dependencies = ["pillow<12"]

[tool.uv.sources]
fw-heudiconv = { git = "https://github.com/lobennett/fw-heudiconv.git", rev = "e7509a4" }
global_signal_plots = { git = "https://github.com/lobennett/global_signal_plots.git", rev = "5d92c33" }
network_events = { git = "https://github.com/lobennett/network_events.git", rev = "7dcad31" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/network_fmri"]
