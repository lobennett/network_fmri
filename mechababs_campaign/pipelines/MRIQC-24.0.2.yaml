# MRIQC 24.0.2 pipeline for a mechababs/BABS campaign on Sherlock.
#
# Schema = con/mechababs@main pipelines/MRIQC-24.0.2.yaml (the 2026-07 rewrite;
# supersedes the old asmacdo `short_name`+top-level-`container` schema). Key
# changes we conform to here:
#   * `mechababs:` namespace  — everything mechababs-only (stripped by
#       merge_config so none reaches the babs config). Holds:
#         selection  — declarative subject/session eligibility rule
#                      (replaces the old select.py FILTERS dict keyed on short_name)
#         container  — {source, name}: image DataLad ds to vendor + pass to
#                      `babs init --container-ds/--container-name`
#   * BIDS-study RIA keys (analysis_path / input_ria_path / output_ria_path) —
#       required now that the babs project nests inside the cloned study (babs#369).
#   * NO `short_name` — the pipeline identity / ledger-column prefix / derivative
#       dir name is now the FILENAME STEM. This file's stem `MRIQC-24.0.2` becomes
#       the derivative dir (`studies/study-<id>/derivatives/MRIQC-24.0.2`), matching
#       upstream. Cluster specifics live on the cluster axis (clusters/sherlock.yaml),
#       so the filename stays platform-neutral.
#
# LOCAL operational config — network_fmri is our source of truth. con/main covers
# local-BIDS selection now (via the study wrapper), so there is NO fork to vendor.

mechababs:
  # Subject/session eligibility. anat-with-a-T1w gate: MRIQC's anatomical IQM
  # workflow needs a T1w; this selects units that have one. (Granularity —
  # per-subject vs per-session — is set by which metadata TSV the study exposes
  # + --processing-level at add-dataset; see the study wrapper. Austin Q4.)
  selection:
    require_datatypes: [anat]
    require_positive: [t1w_num]
  container:
    # Local shim pinning OUR exact mriqc_24.0.2.sif (v24.0.2 = latest stable) at
    # /home/groups/russpold/singularity_images/. NOT a ReproNim fetch (which would
    # pull whatever version ReproNim registers, possibly != 24.0.2 while
    # zip_foldernames below hardcodes 24-0-2). `configure` vendors this into
    # code/<basename>; babs reads the image at the hardcoded
    # <ds>/.datalad/environments/bids-mriqc/image (babs#383 still OPEN → shim
    # required either way). Build once with mriqc-24.0.2-local-shim.sh.
    source: /scratch/users/logben/mechababs_campaigns/mriqc-24.0.2-shim
    name: bids-mriqc

# BIDS-study layout (babs#369): the babs project root IS the analysis dataset and
# the RIA stores live under .babs/ (babs's default top-level input_ria/output_ria
# would break datalad's nesting of the babs project inside the study). MUST match
# across every pipeline in a campaign; merge_config passes these straight through.
analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

bids_app_args:
  # BABS fetches inputs itself; skip MRIQC's own datalad get.
  --no-datalad-get: ""
  $SUBJECT_SELECTION_FLAG: "--participant-label"
  -w: ".git/tmp/wkdir"
  --n_cpus: "4"
  --mem_gb: "16"
  -vv: ""
  # Do not upload IQMs to the public MRIQC web API.
  --no-sub: ""

singularity_args:
  - --containall
  # --pwd is load-bearing: under --containall apptainer drops CWD to a tmpfs $HOME
  # instead of the bound dataset clone. nipype's -w (.git/tmp/wkdir) is RELATIVE,
  # so without --pwd the work dir resolves onto that tiny tmpfs and overflows →
  # ENOSPC while /scratch sits idle. Pin CWD to the on-scratch clone. (upstream #55.)
  - --pwd "${PWD}"
  # Route container /tmp to real scratch disk ($JOB_TMP created + trap-cleaned by
  # the cluster preamble in clusters/sherlock.yaml).
  - -B $JOB_TMP:/tmp
  # MRIQC pulls MNI152NLin2009cAsym for its anatomical IQM workflow; bind the
  # pre-populated Sherlock group cache (verified present:
  # /home/groups/russpold/templateflow/tpl-MNI152NLin2009cAsym) so it needs no
  # writable download target. (Upstream's yaml binds the Dartmouth cache path.)
  - -B /home/groups/russpold/templateflow:/templateflow
  - --env TEMPLATEFLOW_HOME=/templateflow

# NOTE: partition/nodes/ntasks belong on the cluster axis; clusters/sherlock.yaml
# cluster_resources OVERRIDES this block (merge_config applies cluster keys last).
# Kept for schema completeness + non-Sherlock reuse. Keep cpu/mem in sync with the
# cluster yaml.
cluster_resources:
  interpreting_shell: "/bin/bash"
  hard_runtime_limit: "24:00:00"
  customized_text: |
    #SBATCH --cpus-per-task=4
    #SBATCH --mem=16G
    #SBATCH --nodes=1
    #SBATCH --ntasks=1

all_results_in_one_zip: true
zip_foldernames:
  mriqc: "24-0-2"
