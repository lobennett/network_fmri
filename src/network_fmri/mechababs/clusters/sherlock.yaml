script_preamble: |
  export PATH="/scratch/users/${USER}/mechababs-work/campaign-base/bin:$PATH"
  source "{{MECHABABS_VENV}}/bin/activate"
  export PYTHONNOUSERSITE=1
  export OMP_NUM_THREADS=1
  export MKL_NUM_THREADS=1
  export JOB_TMP="${SLURM_TMPDIR:-/scratch/users/${USER}/sjob-tmp/${SLURM_ARRAY_JOB_ID}_${SLURM_ARRAY_TASK_ID}}"
  mkdir -p "${JOB_TMP}"
  trap 'rm -rf "${JOB_TMP}"' EXIT

job_compute_space: "/scratch/users/${USER}"

# Upstream Sherlock wheel caps for glibc 2.17.
env_constraints:
  - greenlet<=3.2.5
  - h5py<=3.14.0
  - pandas<=2.3.2
  - scipy<=1.15.3
  - scikit-learn<=1.7.2
  - scikit-image<=0.25.2
  - pillow<=12.2.0
  - contourpy<=1.3.2
