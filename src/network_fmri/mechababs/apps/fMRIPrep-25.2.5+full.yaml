mechababs:
  depends_on: fMRIPrep-25.2.5+anat
  selection:
    require_datatypes: [anat, func]
    require_positive: [t1w_num, bold_num]
  container:
    source: "{{CONTAINER_DATASET}}"
    name: bids-fmriprep

analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

bids_app_args:
  $SUBJECT_SELECTION_FLAG: "--participant-label"
  -w: "$BABS_TMPDIR"
  --level: "full"
  --dummy-scans: "0"
  --output-spaces: "MNI152NLin2009cAsym:res-2 T1w fsnative fsaverage6"
  --cifti-output: "91k"
  --random-seed: "12345"
  --skull-strip-fixed-seed: ""
  --skull-strip-t1w: "force"
  --no-submm-recon: ""
  --use-syn-sdc: "warn"
  --me-output-echos: ""
  --notrack: ""
  --md-only-boilerplate: ""
  --skip-bids-validation: ""
  --stop-on-first-crash: ""
  --fs-license-file: "{{FREESURFER_LICENSE}}"
  --fs-subjects-dir: '"${PWD}"/sourcedata/fMRIPrep-25.2.5+anat/fMRIPrep-25.2.5+anat/sourcedata/freesurfer'
  --nprocs: "4"
  --omp-nthreads: "2"
  --mem-mb: "32000"

singularity_args:
  - --containall
  - --pwd "${PWD}"
  - -B $JOB_TMP:/tmp
  - -B /home/groups/russpold/templateflow:/templateflow
  - --env TEMPLATEFLOW_HOME=/templateflow

input_datasets:
  fMRIPrep-25.2.5+anat:
    required_files:
      - "*fMRIPrep-25.2.5+anat*.zip"
    is_zipped: true
    path_in_babs: sourcedata/fMRIPrep-25.2.5+anat

cluster_resources:
  interpreting_shell: "/bin/bash"
  hard_runtime_limit: "24:00:00"
  customized_text: |
    #SBATCH --partition=russpold,normal
    #SBATCH --cpus-per-task=8
    #SBATCH --mem=32G
    #SBATCH --nodes=1
    #SBATCH --ntasks=1

all_results_in_one_zip: true
zip_foldernames:
  fMRIPrep-25.2.5+full: "25-2-5"
