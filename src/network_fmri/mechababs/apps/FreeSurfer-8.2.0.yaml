mechababs:
  selection:
    require_datatypes: [anat]
    require_positive: [t1w_num]
  container:
    source: "{{CONTAINER_DATASET}}"
    name: bids-freesurfer

analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

bids_app_args:
  $SUBJECT_SELECTION_FLAG: "--participant-label"
  --fs-license-file: "{{FREESURFER_LICENSE}}"
  --nprocs: "4"

singularity_args:
  - --containall
  - --pwd "${PWD}"
  - -B $JOB_TMP:/tmp
  # FreeSurfer 8.2's mri_vsinus_seg creates temporary files here.
  - -B $JOB_TMP:/scratch

cluster_resources:
  interpreting_shell: "/bin/bash"
  hard_runtime_limit: "24:00:00"
  customized_text: |
    #SBATCH --partition=russpold,normal
    #SBATCH --cpus-per-task=4
    #SBATCH --mem=96G
    #SBATCH --nodes=1
    #SBATCH --ntasks=1

all_results_in_one_zip: true
zip_foldernames:
  FreeSurfer-8.2.0: "8-2-0"
