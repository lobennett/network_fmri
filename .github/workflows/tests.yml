name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use temporary environment and cache
        run: |
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/project-venv" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=$RUNNER_TEMP/uv-cache" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install frozen environment
        run: uv sync --frozen
      - name: Verify checkout and dependency revisions
        run: |
          uv run --frozen python - <<'PY'
          import json
          import tomllib
          from importlib.metadata import distribution
          from pathlib import Path

          import network_fmri

          root = Path.cwd().resolve()
          imported = Path(network_fmri.__file__).resolve()
          print(f"network_fmri: {imported}")
          assert imported == root / "src/network_fmri/__init__.py"
          pins = tomllib.loads((root / "pyproject.toml").read_text())["tool"]["uv"]["sources"]
          for name, source in pins.items():
              direct = json.loads(distribution(name).read_text("direct_url.json"))
              got = direct["vcs_info"]["commit_id"]
              want = source["rev"]
              print(f"{name}: {got} (pin {want})")
              assert got.startswith(want), f"{name}: {got} does not match {want}"
          PY
      - name: Run tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y git-annex
          uv run --frozen pytest -q -ra
      - name: Build package
        run: uv build
      - name: Check repository diff
        run: git diff --check
