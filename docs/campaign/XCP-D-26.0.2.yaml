# XCP-D 26.0.2, chained on subject-level fMRIPrep output.
#
# SUBJECT-level, deliberately matching the upstream: babs chaining works when producer
# and consumer share a processing level (the zip is matched per subject and the job
# universe is the subjects holding an fMRIPrep zip). XCP-D is also cheap relative to
# fMRIPrep (~1-2 h/subject), so per-session fan-out buys nothing.
#
# The input key names the fMRIPrep pipeline's stem, which IS the chain signal;
# origin_url is deliberately absent (mechababs injects the producer's output RIA once
# it has merged).
#
# DECIDE before scaling past discovery (science flags, not plumbing):
#   --nuisance-regressors  36P below is the conventional default
#   band-pass              0.01-0.08 default; network_glm defers its CIFTI residual
#                          filtering to XCP-D (--no-residual-filter), so keep consistent
#   --fd-thresh            censoring threshold (0.3 below; distinct from MRIQC fd_thres)

mechababs:
  processing_level: subject
  # XCP-D reads fMRIPrep derivatives, not raw BIDS, and babs passes input_datasets[0]
  # as the positional input dir — so the chained input has to lead. Without this the
  # app is handed sourcedata/raw and finds nothing to post-process.
  primary_input: fMRIPrep-25.2.5
  selection:
    require_positive: [t1w_num, bold_num]
  container:
    # Resolved relative to the campaign root by mechababs.
    source: ../xcpd-26.0.2-shim
    name: bids-xcpd

analysis_path: "."
input_ria_path: ".babs/input_ria"
output_ria_path: ".babs/output_ria"

# XCP-D counts a session as anatomical if it holds a T1w OR a T2w, and refuses any tree
# that is neither one-anat-per-func-session nor one-anat-for-all (parser.py:1080). This
# study acquires the T2w in a different session from the T1w for 9 of 46 subjects, so
# fMRIPrep emits a T2w-only anat/ there — a phantom second anatomical session, and the
# run dies before doing any work.
#
# Dropping those anat/ dirs from XCP-D's copy of the input costs nothing: fMRIPrep has
# already used the T2w to refine the surfaces, and those surfaces are what XCP-D reads.
# It leaves exactly one anatomical session, so XCP-D takes the one-to-all path and
# processes every functional session against the T1w session's anatomy. Verified on
# sub-s03: workflow built as sub_s03_ses_13_ses_010203...12_wf.
#
# --bids-filter-file cannot do this: the filter-to-session-list path in parser.py is
# commented out, and a .bidsignore does not hide the files from the layout query either
# (both tested). Editing the unzipped input is the only lever.
pre_app_commands:
  - |
    for anat in sourcedata/fMRIPrep-25.2.5/fMRIPrep-25.2.5/sub-*/ses-*/anat; do
        [ -d "$anat" ] || continue
        ls "$anat"/*_T1w.nii.gz >/dev/null 2>&1 || { echo "pruning T2w-only anat: $anat"; rm -rf "$anat"; }
    done

bids_app_args:
  $SUBJECT_SELECTION_FLAG: "--participant-label"
  -w: ".git/tmp/wkdir"
  # Flag set mirrors the lab reference (grimsrud pfm_compare run_xcpd.sh), which runs
  # this exact stack: XCP-D 26.0.2 on fMRIPrep 25.2.5, one subject per job.
  --mode: "abcd"
  --input-type: "fmriprep"
  --despike: ""
  --fd-thresh: "0.3"
  --warp-surfaces-native2std: ""
  --combine-runs: ""
  --linc-qc: ""
  --min-time: "150"
  --min-coverage: "0.5"
  --band-stop-min: "12"
  --band-stop-max: "20"
  --motion-filter-type: "notch"
  --motion-filter-order: "4"
  --smoothing: "0"
  # Ours only: the tree is trimmed and fMRIPrep ran --dummy-scans 0, so be explicit
  # rather than let auto-detection differ between runs.
  --dummy-scans: "0"
  # BABS writes this into a double-quoted shell bind, so HOME expands per operator.
  --fs-license-file: "${HOME}/license.txt"
  --notrack: ""
  --stop-on-first-crash: ""
  --nprocs: "8"
  --omp-nthreads: "3"
  --mem-mb: "180000"

singularity_args:
  - --containall
  - --pwd "${PWD}"
  - -B $JOB_TMP:/tmp
  - -B /home/groups/russpold/templateflow:/templateflow
  - --env TEMPLATEFLOW_HOME=/templateflow

input_datasets:
  fMRIPrep-25.2.5:
    required_files:
      - "*fMRIPrep-25.2.5*.zip"
    is_zipped: true
    path_in_babs: sourcedata/fMRIPrep-25.2.5

cluster_resources_override:
  hard_runtime_limit: "48:00:00"
  customized_text: |
    #SBATCH --partition=russpold,normal
    #SBATCH --cpus-per-task=9
    #SBATCH --mem=192G
    #SBATCH --nodes=1
    #SBATCH --ntasks=1

all_results_in_one_zip: true
zip_foldernames:
  XCP-D-26.0.2: "26-0-2"
