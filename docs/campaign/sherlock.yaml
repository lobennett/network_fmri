# Stanford Sherlock cluster profile for a con/mechababs/BABS campaign.
# Same schema as con/mechababs clusters/{dartmouth,unity}.yaml:
#   script_preamble  — shell run at the top of every BABS job (module loads, venv)
#   job_compute_space — scratch dir BABS uses for the job working space
#   cluster_resources — Slurm directives (Sherlock has NO auto-routing → must set
#                       --partition explicitly; this block OVERRIDES the pipeline's
#                       cluster_resources because merge_config applies cluster keys last)
#
# LOCAL operational config — network_fmri is our source of truth. See the campaign
# README + MEETING_BRIEF for the run sequence.

script_preamble: |
  # No `module` setup: Sherlock has no /etc/profile.d/modules.sh, and this job needs
  # no Lmod modules — git-annex comes from a standalone prefix below, apptainer is
  # in /bin, and everything else is in the campaign venv.

  # git-annex — CRITICAL: Sherlock's modules only reach v8 (`ml spider git-annex`
  # → 6.x, 8.20210622). Our BIDS DataLad datasets were created with git-annex 10
  # and v8 CANNOT operate on the v10 repo format (fails `git-annex filter-process`
  # with "Invalid argument"). So we do NOT `module load system git-annex`; instead
  # put a standalone git-annex >=10 first on PATH. Provision it once (see the
  # README §git-annex-10) into the prefix below.
  export PATH="/home/groups/russpold/sw/git-annex-standalone:$PATH"
  ga_ver=$(git annex version | head -1); echo "using $ga_ver"
  case "$ga_ver" in *": 1"[0-9]*) : ;; *) echo "FATAL: need git-annex >=10, got $ga_ver" >&2; exit 1;; esac

  # apptainer/singularity are already on PATH (/bin) on Sherlock — no module.

  # 7z — BABS's <pipeline>_zip.sh zips the outputs with `7z`, which is NOT on the
  # default PATH here. Without it the job runs the whole pipeline, fails at the zip,
  # and cleanup drops the finished results (exit 127 after ~40 min of compute).
  # This is the `system p7zip/16.02` module's bindir; the binary is self-contained
  # (verified: runs with an empty env, no unresolved libs), so PATH is enough.
  export PATH="/share/software/user/open/p7zip/16.02/bin:$PATH"
  command -v 7z >/dev/null || { echo "FATAL: 7z not on PATH" >&2; exit 1; }

  # Campaign venv (abspath substituted at compose time by merge_config's
  # {{MECHABABS_VENV}} placeholder).
  source "{{MECHABABS_VENV}}/bin/activate"

  # High-IOPS per-job temp on Lustre scratch (created + trap-cleaned per job).
  # Referenced by the MRIQC pipeline's `-B $JOB_TMP:/tmp` singularity arg.
  export JOB_TMP="/scratch/users/${USER}/sjob-tmp/${SLURM_ARRAY_JOB_ID}_${SLURM_ARRAY_TASK_ID}"
  mkdir -p "${JOB_TMP}"
  trap 'rm -rf "${JOB_TMP}"' EXIT

# NOT /scratch/${USER} — on Sherlock $SCRATCH is /scratch/users/<sunetid>, and
# /scratch itself is root-owned, so the shorter form fails with `cd: No such file`.
job_compute_space: "/scratch/users/${USER}"

# Max array tasks running at once, baked into babs's `--array=1-N%<throttle>`.
# russpold is a 16-node/448-CPU lab partition, so an unthrottled array would take the
# whole thing and block labmates. Per-job cost differs by pipeline -- MRIQC asks 5 CPUs,
# fMRIPrep 8, XCP-D 9 -- so at 8 concurrent the worst case is 72 CPUs, ~16% of russpold,
# with the rest spilling to `normal`. Baked in at `babs init` as --throttle, so it must be
# set before scaffolding; a live array can be changed with
# `scontrol update ArrayTaskThrottle=N`.
array_throttle: 8

# Sherlock has NO Slurm auto-routing — every job MUST name a --partition.
# russpold (lab owner, 16 nodes, up to 7-day) first, normal (shared pool) as
# fallback; Slurm schedules on whichever frees first.
# This whole block REPLACES the pipeline's cluster_resources (merge_config applies
# cluster keys last), so these are the EFFECTIVE Slurm directives. --mem=32G, not the
# 24G of con/main's MRIQC reference: our sessions peaked at 22G MaxRSS (multi-echo, 5
# func runs), which left almost no headroom over MRIQC's own --mem_gb 16. Keep in sync
# with the pipeline yaml until upstream babs#3 lets resources come from the cluster axis.
cluster_resources:
  interpreting_shell: "/bin/bash"
  hard_runtime_limit: "24:00:00"
  customized_text: |
    #SBATCH --partition=russpold,normal
    #SBATCH --cpus-per-task=4
    #SBATCH --mem=32G
    #SBATCH --nodes=1
    #SBATCH --ntasks=1
